name: Certificação noturna

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificar:
    name: Testes completos e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      DATABASE_NEON_AUTH_BASE_URL: https://auth-build.invalid
      NEON_AUTH_COOKIE_SECRET: chave-exclusiva-de-build-sem-acesso-a-producao
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar código
        run: npm run lint
      - name: Executar testes isolados
        run: npm test
      - name: Confirmar build de produção
        run: npm run build
